<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="description" content="Wir zwei – das interaktive Beziehungsjournal für Paare." />
    <title>Wir zwei</title>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wir zwei" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      html, body, #root { margin: 0; padding: 0; background: #FAF7F2; }
      * { -webkit-tap-highlight-color: transparent; }
      button { font: inherit; }
      #laden {
        min-height: 100vh; display: grid; place-items: center;
        font-family: Georgia, serif; font-size: 24px; color: #4A3B2E;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="laden">Einen Moment …</div></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" crossorigin></script>
    <script type="text/babel" data-presets="react" src="./app.jsx"></script>

    <script>
      /* Offline-Betrieb einschalten */
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
